services:
  activities:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    volumes:
      - ./:/app
      - activities_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  # Optional. Zip import never calls it. Connectors do.
  # Published on localhost only: the page sends the Garmin key through this port.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3011:3011"
    volumes:
      - ./backend:/app
    command: ["node", "--watch", "src/server.js"]

volumes:
  activities_node_modules:
