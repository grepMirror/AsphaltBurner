services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  activities:
    build:
      context: ./activities
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    volumes:
      - ./activities:/app
      - activities_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  web_node_modules:
  activities_node_modules:
